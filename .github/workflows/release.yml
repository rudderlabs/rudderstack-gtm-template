name: Release

# Merging to main opens or updates a release PR that carries everything the
# release needs, including the Community Template Gallery entry. Merging that
# release PR is the publish -- there is no follow-up commit on main.
#
# Publishing to the Gallery is exactly that metadata.yaml entry: Google reads
# the template.tpl found at each listed SHA. The SHA recorded is the main commit
# the release PR is based on, which already carries the template.tpl being
# released -- the release PR itself only touches CHANGELOG.md, package.json,
# .release-please-manifest.json and metadata.yaml.
#
# Nothing reaches template users until that entry exists, and even then they are
# prompted in GTM to accept the update rather than being upgraded silently.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release please
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # to create commits, tags, and releases
          permission-pull-requests: write # to create and update the release PR

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please only reports prs_created on the run that actually writes
      # the release PR. A rerun after a failure further down reports false for
      # that same still-open PR, which would skip the Gallery entry and leave
      # the release mergeable without publishing its template. Resolve the open
      # release PR from its label instead, so the steps below are driven by
      # whether a release is pending rather than by what this run happened to do.
      #
      # Deliberately not `gh pr list --label`: that issues a GraphQL search,
      # and the search index trails PR creation by seconds -- long enough to
      # miss a release PR labelled one second earlier, which is exactly what
      # happened. The pulls endpoint reads the pull requests themselves, and
      # the label is matched here.
      - name: Find the open release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        run: |
          set -euo pipefail

          # An empty result is only suspicious when release-please just wrote
          # the PR, so that is the one case worth waiting out replica lag for.
          attempts=1
          if [ "${PRS_CREATED}" = "true" ]; then
            attempts=5
          fi

          branch=""
          for attempt in $(seq 1 "${attempts}"); do
            branch=$(gh api "repos/${REPO}/pulls?state=open&per_page=100" \
              --jq '[.[] | select(any(.labels[]; .name == "autorelease: pending"))]
                      | first.head.ref // ""')

            if [ -n "${branch}" ] || [ "${attempt}" -eq "${attempts}" ]; then
              break
            fi
            sleep 3
          done

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          if [ -n "${branch}" ]; then
            echo "Release PR branch: ${branch}"
          elif [ "${PRS_CREATED}" = "true" ]; then
            # Skipping quietly here is how a release reaches main with no
            # Gallery entry, so this fails the run instead.
            echo "::error::release-please reported a new release PR, but no open PR labelled 'autorelease: pending' is visible."
            exit 1
          else
            echo "No open release PR, so there is nothing to publish."
          fi

      - name: Checkout the release branch
        if: ${{ steps.release-pr.outputs.branch != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          # The gallery commit is created through the API by the signed-commit
          # step below, so no git credentials need to survive the checkout.
          persist-credentials: false

      # release-please rewrites this branch on every push to main, so an entry
      # for the pending release is replaced rather than stacked.
      # yq is not present on the self-hosted runners, so it is fetched at a
      # pinned version and checksum-verified rather than assumed.
      - name: Install yq
        if: ${{ steps.release-pr.outputs.branch != '' }}
        env:
          YQ_VERSION: v4.53.6
          YQ_SHA256: c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385
        run: |
          set -euo pipefail
          if command -v yq >/dev/null 2>&1; then
            echo "yq already present: $(yq --version)"
            exit 0
          fi
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Add the Gallery entry to the release PR
        id: gallery
        if: ${{ steps.release-pr.outputs.branch != '' }}
        env:
          # The main commit this release PR is based on. Its template.tpl is
          # exactly what this release ships, which is what Google reads.
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          NOTE="Release $(yq -r '.["."]' .release-please-manifest.json)"
          export NOTE

          yq -i '.versions = [{"sha": strenv(SHA), "changeNotes": strenv(NOTE)}]
                   + (.versions | map(select(.changeNotes != strenv(NOTE))))' metadata.yaml

          # A rerun over an entry that is already correct has nothing to commit,
          # and the signed-commit step below rejects an empty change set.
          if git diff --quiet -- metadata.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${SHA} is already recorded as ${NOTE}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "recorded ${SHA} as ${NOTE}"
          fi

      - name: Create a verified commit on the release PR
        if: ${{ steps.gallery.outputs.changed == 'true' }}
        uses: ryancyq/github-signed-commit@cb9b21ee83578fe8e26a9eda530015aedf0c7c5b # v1.4.1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          branch-name: ${{ steps.release-pr.outputs.branch }}
          commit-message: 'chore: publish this release to the gallery'
          files: |
            metadata.yaml

      - name: Send release notification to Slack
        id: slack-release-notification
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        continue-on-error: true
        env:
          SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          RELEASE_PLEASE_TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_PLEASE_VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          ACTOR_URL: ${{ github.server_url }}/${{ github.actor }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_RELEASE_WEBHOOK_URL}" ]; then
            echo "::notice::SLACK_RELEASE_WEBHOOK_URL is not configured; skipping Slack release notification."
            exit 0
          fi

          version="${RELEASE_PLEASE_VERSION}"
          if [ -z "${version}" ]; then
            manifest_json=$(gh api "repos/${REPO}/contents/.release-please-manifest.json?ref=${COMMIT_SHA}" --jq '.content' | base64 -d || true)
            version=$(printf '%s' "${manifest_json}" | sed -n 's/^[[:space:]]*"\."[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          fi

          tag_name="${RELEASE_PLEASE_TAG_NAME}"
          if [ -z "${tag_name}" ] && [ -n "${version}" ]; then
            tag_name="v${version}"
          fi

          display_version="${version}"
          if [ -z "${display_version}" ]; then
            display_version="${tag_name:-unknown}"
          elif [ "${display_version#v}" = "${display_version}" ]; then
            display_version="v${display_version}"
          fi

          if [ -n "${tag_name}" ]; then
            release_url="https://github.com/${REPO}/releases/tag/${tag_name}"
          else
            release_url="https://github.com/${REPO}/releases"
          fi

          released_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          payload=$(mktemp)
          cat > "${payload}" <<EOF
          {
            "text": "*:rocket: New Release - RudderStack GTM Template - <${release_url}|${display_version}>*",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": ":rocket: New Release - RudderStack GTM Template"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*<${release_url}|${display_version}>*\n${released_at}"
                },
                "accessory": {
                  "type": "image",
                  "image_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                  "alt_text": "GitHub Icon"
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": ":boom: Published by <${ACTOR_URL}|${ACTOR}>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": ":gear: <${GITHUB_RUN_URL}|View workflow run details>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "For more details, check the full release notes <${release_url}|here>."
                  }
                ]
              }
            ]
          }
          EOF

          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            --data @"${payload}" \
            "${SLACK_RELEASE_WEBHOOK_URL}" \
            >/dev/null
          rm -f "${payload}"
