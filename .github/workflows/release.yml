name: Release

# Merging to main opens or updates a release PR that carries everything the
# release needs, including the Community Template Gallery entry. Merging that
# release PR is the publish -- there is no follow-up commit on main.
#
# Publishing to the Gallery is exactly that metadata.yaml entry: Google reads
# the template.tpl found at each listed SHA. The SHA recorded is the main commit
# the release PR is based on, which already carries the template.tpl being
# released -- the release PR itself only touches CHANGELOG.md, package.json,
# .release-please-manifest.json and metadata.yaml.
#
# Nothing reaches template users until that entry exists, and even then they are
# prompted in GTM to accept the update rather than being upgraded silently.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release please
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # to create commits, tags, and releases
          permission-pull-requests: write # to create and update the release PR

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout the release branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Add the Gallery entry to the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          # The main commit this release PR is based on. Its template.tpl is
          # exactly what this release ships, which is what Google reads.
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version=$(sed -n 's/.*"\.":[[:space:]]*"\([^"]*\)".*/\1/p' .release-please-manifest.json)
          if [ -z "${version}" ]; then
            echo "could not read the release version from .release-please-manifest.json" >&2
            exit 1
          fi

          # release-please rewrites this branch on every push to main, so a
          # pending entry for this version is replaced rather than stacked.
          awk -v sha="${RELEASE_SHA}" -v note="Release ${version}" '
            { lines[NR] = $0 }
            END {
              for (i = 1; i <= NR; i++) {
                print lines[i]
                if (lines[i] == "versions:") {
                  print "  - sha: " sha
                  print "    changeNotes: " note
                  if (i + 2 <= NR && lines[i + 2] == "    changeNotes: " note) {
                    i += 2
                  }
                }
              }
            }
          ' metadata.yaml > metadata.yaml.tmp

          mv metadata.yaml.tmp metadata.yaml
          echo "recorded ${RELEASE_SHA} for ${version}"

      - name: Commit to the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          if git diff --quiet -- metadata.yaml; then
            echo "metadata.yaml already current, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata.yaml
          git commit -m "chore: publish this release to the gallery"
          git push
