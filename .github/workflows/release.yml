name: Release

# Merging to main opens or updates a release PR that carries everything the
# release needs, including the Community Template Gallery entry. Merging that
# release PR is the publish -- there is no follow-up commit on main.
#
# Publishing to the Gallery is exactly that metadata.yaml entry: Google reads
# the template.tpl found at each listed SHA. The SHA recorded is the main commit
# the release PR is based on, which already carries the template.tpl being
# released -- the release PR itself only touches CHANGELOG.md, package.json,
# .release-please-manifest.json and metadata.yaml.
#
# Nothing reaches template users until that entry exists, and even then they are
# prompted in GTM to accept the update rather than being upgraded silently.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release please
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # to create commits, tags, and releases
          permission-pull-requests: write # to create and update the release PR

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout the release branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          persist-credentials: false

      # release-please rewrites this branch on every push to main, so an entry
      # for the pending release is replaced rather than stacked.
      - name: Add the Gallery entry to the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: mikefarah/yq@e1d5d6eb36b8995bf29e5acb561659824dc47be3 # v4.53.6
        env:
          # The main commit this release PR is based on. Its template.tpl is
          # exactly what this release ships, which is what Google reads.
          SHA: ${{ github.sha }}
        with:
          cmd: |
            NOTE="Release $(yq -r '.["."]' .release-please-manifest.json)" \
            yq -i '.versions = [{"sha": strenv(SHA), "changeNotes": strenv(NOTE)}]
                     + (.versions | map(select(.changeNotes != strenv(NOTE))))' metadata.yaml

      - name: Create a verified commit on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: ryancyq/github-signed-commit@cb9b21ee83578fe8e26a9eda530015aedf0c7c5b # v1.4.1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          branch-name: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          commit-message: 'chore: publish this release to the gallery'
          files: |
            metadata.yaml
