name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Template harness
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the template harness
        run: npm test

  metadata:
    name: Gallery metadata
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract the published versions
        uses: mikefarah/yq@e1d5d6eb36b8995bf29e5acb561659824dc47be3 # v4.53.6
        with:
          cmd: yq -r '.versions[].sha' metadata.yaml > published-shas.txt

      - name: Every published version must point at a real commit
        run: |
          set -euo pipefail

          if [ ! -s published-shas.txt ]; then
            echo "metadata.yaml lists no versions" >&2
            exit 1
          fi

          failed=0
          while read -r sha; do
            [ -n "${sha}" ] || continue
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "ok ${sha}"
            else
              echo "MISSING ${sha}"
              failed=1
            fi
          done < published-shas.txt

          if [ "${failed}" -ne 0 ]; then
            echo "metadata.yaml references commits that do not exist" >&2
            exit 1
          fi

          echo "$(wc -l < published-shas.txt | tr -d ' ') version(s) verified"
